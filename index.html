  .bg-layer.zoom img{animation:bgZoom 18s ease-out forwards;}
  .bg-main-img{opacity:0.2;filter:saturate(0);}
  .bg-shade{position:absolute;inset:0;}
  #stars{position:absolute;inset:0;width:100%;height:100%;transition:opacity 0.7s ease;}
  #stars.off{opacity:0;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.7) 100%);}

  #back-btn:hover{color:#fff;}
  #back-btn svg{width:14px;height:14px;flex-shrink:0;}
  #back-btn span{position:absolute;bottom:-4px;left:0;height:1px;background:#fff;width:0;transition:width 0.3s;}
  #back-btn:hover span{width:100%;}

  /* HOME */

  #home-logo{height:72px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(255,255,255,0.28));animation:floaty 6s ease-in-out infinite;}
  @media(min-width:768px){#home-logo{height:96px;}}
  #tagline{margin-top:10px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:0.35em;padding-left:0.35em;color:rgba(255,255,255,0.3);text-transform:lowercase;text-align:center;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

  #cards{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  @media(min-width:768px){#cards{flex-direction:row;}}

  .card{position:relative;overflow:hidden;border-radius:26px;border:1px solid rgba(255,255,255,0.12);cursor:pointer;

    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);}

  .card.active{border-color:rgba(255,255,255,0.16);height:500px;}
  @media(min-width:768px){
    .card{width:104px;height:460px;}
    .card.active{width:320px;height:500px;}
  }
  .collapsed{position:absolute;inset:0;transition:opacity 0.4s;}
  .card.active .collapsed{opacity:0;}
  .collapsed img.cbg{width:100%;height:100%;object-fit:cover;opacity:0.7;}
  .collapsed .cgrad{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.15),rgba(0,0,0,0.5) 55%,rgba(0,0,0,0.85));}
  .collapsed-inner{position:absolute;inset:0;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:10px;transition:all 0.4s;}
  .card.active .collapsed-inner{opacity:0;transform:scale(0.95);pointer-events:none;}
  @media(min-width:768px){.collapsed-inner{flex-direction:column;transform:translateY(10px);}}
  .cname{font-weight:800;font-size:14px;letter-spacing:-0.01em;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  @media(min-width:768px){.cname{font-size:15px;max-width:100%;}}

  .expanded{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(26,26,34,0.62),rgba(10,10,13,0.82));backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,0.10);transition:opacity 0.4s;opacity:0;pointer-events:none;}
  .card.active .expanded{opacity:1;transition-delay:0.1s;pointer-events:auto;}
  .banner{position:relative;height:158px;flex-shrink:0;overflow:hidden;}

  @media(min-width:768px){#enter img{height:140px;}}
  #enter p{margin-top:24px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.3em;padding-left:0.3em;color:rgba(255,255,255,0.4);text-transform:uppercase;}

  .fade-up{animation:fadeUp 0.6s var(--ease) both;}
  .delay-1{animation-delay:0.06s;}.delay-2{animation-delay:0.12s;}
  .delay-3{animation-delay:0.18s;}.delay-4{animation-delay:0.24s;}
  .delay-5{animation-delay:0.3s;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>

    var oart = activityArt(other);

    return '<div class="gamebox"><div class="spot-top">' + oartHtml + '<div class="t">' +
      '<p class="spot-label">' + olabel + '</p>' +
      '<p class="spot-song">' + esc(otxt) + '</p>' + osub +
      '</div></div></div>';
  }
  return '<p class="act-none">No Current Activity</p>';
}

/* AVATAR BUILDER */
function buildAvatar(parent, imgCls, dotCls){
  var wrap = h("div", "av", parent);
  var img = h("img", "avimg " + imgCls, wrap);
  img.draggable = false;
  img.alt = "";
  var deco = h("img", "deco hidden", wrap);
  deco.draggable = false;
  deco.alt = "";
  var dot = h("span", "dot " + dotCls, wrap);
  return { wrap: wrap, img: img, deco: deco, dot: dot };
}

/* FEATURED CARD */
var DELAYS = ["delay-1","delay-2","delay-3","delay-4","delay-5"];
function buildFeaturedCard(person, index){
  var root = h("div", "card fade-up " + DELAYS[index % DELAYS.length], $("cards"));
  cardRoots[person.key] = root;

  var collapsed = h("div", "collapsed", root);
  var cbg = h("img", "cbg", collapsed);
  cbg.src = person.bg;
  cbg.alt = "";
  h("div", "cgrad", collapsed);

  var inner = h("div", "collapsed-inner", root);
  var av1 = buildAvatar(inner, "av-xs", "dot-sm");
  var cname = h("p", "cname pulse", inner);
  cname.textContent = "···";

  var expanded = h("div", "expanded", root);
  var banner = h("div", "banner", expanded);
  var bimg = h("img", "", banner);
  bimg.src = person.bg;
  bimg.alt = "";
  h("div", "bgrad", banner);
  var avc = h("div", "avcenter", expanded);
  var av2 = buildAvatar(avc, "av-md", "dot-md");
  var names = h("div", "names", expanded);
  var h3 = h("h3", "pulse", names);
  h3.textContent = "···";

  var lastSig = null;
  var socRow = h("div", "socials", expanded);
  if (person.socials && person.socials.length){
    person.socials.forEach(function(s){
      var a = document.createElement("a");
      a.className = "soc";
      a.href = s[1];
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.title = s[0];
      a.innerHTML = socIcon(s[0]);
      a.addEventListener("click", function(ev){ ev.stopPropagation(); });
      socRow.appendChild(a);
    });
  }

  h("div", "adiv", expanded);
  var activity = h("div", "activity", expanded);

  function paint(s){
    var display = s.notFound ? "Unknown User" : (s.profile ? s.profile.display : "···");
    var avatar = s.profile ? s.profile.avatar : defaultAvatar(person.discordId);
    var deco = s.profile ? s.profile.decoration : null;
    var status = s.presence ? s.presence.status : "offline";
    var color = STATUS_COLORS[status] || "#5c5e66";
    av1.img.src = avatar; av1.img.alt = display;
    av2.img.src = avatar; av2.img.alt = display;
    if (deco){ av1.deco.src = deco; av1.deco.classList.remove("hidden"); av2.deco.src = deco; av2.deco.classList.remove("hidden"); }
    else { av1.deco.classList.add("hidden"); av2.deco.classList.add("hidden"); }
    av1.wrap.classList.toggle("has-deco", !!deco);
    av2.wrap.classList.toggle("has-deco", !!deco);
    av1.dot.style.background = color;
    av2.dot.style.background = color;
    cname.textContent = display;
    cname.classList.toggle("pulse", s.profileLoading);
    h3.textContent = display;
    h3.classList.toggle("pulse", s.profileLoading);
    var sig = (s.profileLoading && !s.presence) ? "loading" : presenceSig(s.presence);
    if (sig !== lastSig){ lastSig = sig; activity.innerHTML = activityHTML(s.presence, s.profileLoading); }
  }
  subscribe(person.discordId, paint);

  root.addEventListener("mouseenter", function(){ setHovered(person.key); });
  root.addEventListener("mouseleave", function(){ setHovered(null); });
  root.addEventListener("click", function(){
    var s = snapshot(person.discordId);
    if (!s.profile) retryProfile(person.discordId);
    setHovered(hoveredKey === person.key ? null : person.key);
  });
}

/* MEMBER CARD */
function buildMemberCard(person, index){
  var root = h("div", "mcard fade-up " + DELAYS[index % DELAYS.length], $("mgrid"));
  cardRoots[person.key] = root;

  var bg = h("img", "mbg", root);
  bg.src = person.bg;
  bg.alt = "";
  h("div", "mgrad", root);

  var mav = h("div", "mav", root);
  var av = buildAvatar(mav, "av-lg", "dot-md");

  var info = h("div", "minfo", root);
  var dname = h("p", "dname pulse", info);
  dname.textContent = "···";
  var u2 = h("p", "uname", info);
  u2.textContent = "@···";

  function paint(s){
    var display = s.notFound ? "Unknown User" : (s.profile ? s.profile.display : "···");
    var user = s.notFound ? "invalid-id" : (s.profile ? s.profile.username : "···");
    var avatar = s.profile ? s.profile.avatar : defaultAvatar(person.discordId);
    var deco = s.profile ? s.profile.decoration : null;
    var status = s.presence ? s.presence.status : "offline";
    av.img.src = avatar; av.img.alt = display;
    if (deco){ av.deco.src = deco; av.deco.classList.remove("hidden"); }
    else { av.deco.classList.add("hidden"); }
    av.wrap.classList.toggle("has-deco", !!deco);
    av.dot.style.background = STATUS_COLORS[status] || "#5c5e66";
    dname.textContent = display;
    dname.classList.toggle("pulse", s.profileLoading);
    u2.textContent = "@" + user;
  }
  subscribe(person.discordId, paint);

  root.addEventListener("mouseenter", function(){ setHovered(person.key); });
  root.addEventListener("mouseleave", function(){ setHovered(null); });
  root.addEventListener("click", function(){
    var s = snapshot(person.discordId);
    if (!s.profile) retryProfile(person.discordId);
    setHovered(hoveredKey === person.key ? null : person.key);
  });
}

/* MUTE */
var VOL_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" x2="17" y1="9" y2="15"/><line x1="17" x2="23" y1="9" y2="15"/></svg>';
var EQ = '<span class="eq"><i class="eq-1"></i><i class="eq-2"></i><i class="eq-3"></i></span>';
function renderMute(){
  var btn = $("mute");
  if (muted || !isPlaying){ btn.innerHTML = VOL_X; btn.title = "unmute"; }
  else { btn.innerHTML = EQ; btn.title = "mute"; }
}

/* STARFIELD */
function initStars(){
  var canvas = $("stars");
  var ctx = canvas.getContext("2d");
  if (!ctx) return;
  var w = (canvas.width = window.innerWidth);
  var hgt = (canvas.height = window.innerHeight);
  var stars = [];
  for (var i = 0; i < 130; i++){
    stars.push({ x: Math.random() * w, y: Math.random() * hgt, r: Math.random() * 1.3 + 0.3, p: Math.random() * Math.PI * 2, sp: Math.random() * 0.02 + 0.005 });
  }
  window.addEventListener("resize", function(){
    w = canvas.width = window.innerWidth;
    hgt = canvas.height = window.innerHeight;
  });
  (function tick(){
    ctx.clearRect(0, 0, w, hgt);
    for (var j = 0; j < stars.length; j++){
      var st = stars[j];
      st.p += st.sp;
      var tw = 0.3 + Math.abs(Math.sin(st.p)) * 0.6;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255," + tw.toFixed(3) + ")";
      ctx.fill();
    }
    requestAnimationFrame(tick);
  })();
}

/* INIT */
function init(){
  $("home-logo").src = CONFIG.logo;
  $("enter-logo").src = CONFIG.logo;
  $("tagline").textContent = CONFIG.tagline;
  $("bg-main-img").src = CONFIG.mainBg;
  try {
    var fav = $("favicon");
    fav.type = (CONFIG.logo.indexOf("data:image/svg") === 0) ? "image/svg+xml" : "image/png";
    fav.href = CONFIG.logo;
  } catch(e){}

  var holder = $("bg-people");
  for (var i = 0; i < ALL_PEOPLE.length; i++){
    (function(p){
      var layer = h("div", "bg-layer", holder);
      var img = h("img", "", layer);
      img.src = p.bg;
      img.alt = "";
      img.loading = "eager";
      var d1 = h("div", "bg-shade", layer);
      d1.style.background = "rgba(0,0,0,0.5)";
      var d2 = h("div", "bg-shade", layer);
      d2.style.background = "linear-gradient(to bottom,rgba(0,0,0,0.6),transparent,rgba(0,0,0,0.85))";
      bgLayers[p.key] = layer;
    })(ALL_PEOPLE[i]);
  }

  for (var f = 0; f < FEATURED.length; f++) buildFeaturedCard(FEATURED[f], f);
  for (var m = 0; m < MEMBERS.length; m++) buildMemberCard(MEMBERS[m], m);

  (function(){
    var seen = {}, ids = [], all = CONFIG.featured.concat(CONFIG.members), i;
    for (i = 0; i < all.length; i++){ if (!seen[all[i]]){ seen[all[i]] = 1; ids.push(all[i]); } }
    initLiveSocket(ids);
  })();

  $("members-btn").addEventListener("click", function(){
    setView(view === "members" ? "home" : "members");
  });
  $("back-btn").addEventListener("click", function(){
    setView("home");
  });

  renderMute();
  $("mute").addEventListener("click", function(){
    muted = !muted;
    if (!audioEl){ renderMute(); return; }
    if (muted){
      savePos();
      try { audioEl.pause(); } catch(e){}
      isPlaying = false;
    } else {
      try { audioEl.volume = 0; } catch(e){}
      seekTo(currentUrl);
      audioEl.play().then(function(){ isPlaying = true; renderMute(); }).catch(function(){ isPlaying = false; renderMute(); });
      fadeTo(0.5, 400);
    }
    renderMute();
  });

  $("enter").addEventListener("click", function(){
    if (entered) return;
    entered = true;
    var ov = $("enter");
    ov.style.transition = "opacity 0.4s";
    ov.style.opacity = "0";
    setTimeout(function(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }, 420);
    audioEl = new Audio(CONFIG.mainMusic);
    audioEl.loop = true;
    audioEl.preload = "auto";
    audioEl.volume = 0;
    currentUrl = CONFIG.mainMusic;
    audioEl.play().then(function(){
      if (muted){
        try { audioEl.pause(); } catch(e){}
        isPlaying = false;
        renderMute();
      } else {
        isPlaying = true;
        renderMute();
        fadeTo(0.5, 900);
      }
    }).catch(function(){ isPlaying = false; renderMute(); });
  });

  initStars();
  applyHover();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();
</script>
